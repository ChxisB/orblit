name: Release

# A tag such as v1.0.0 builds the editor for Linux, Windows and macOS and attaches one zip
# file for each to a GitHub Release. Each zip holds the Avalonia editor app with the engine
# beside it. The app hosts the engine as a shared library, and Play starts the engine
# program. The same tag builds the export templates for all three and attaches them as
# one .tpz file, which the editor installs to export a game. A pull
# request that edits this workflow runs the same builds and publishes nothing. The tag must
# match version.py.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/scons-build/action.yml
      - dist/scripts/install_*.py
      - dist/scripts/check_packaged_editor.sh
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # production=yes builds a static, optimized binary with no debug symbols. Release builds
  # run no unit tests, so the tests option stays off.
  SCONS_FLAGS: >-
    production=yes
    module_csharp_enabled=yes
    module_text_system_fallback_enabled=yes
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_VERSION: 10.0.100
  # Only a tag build calls itself official. A dry run keeps the gh name.
  BUILD_NAME_INPUT: ${{ startsWith(github.ref, 'refs/tags/v') && 'official' || '' }}

jobs:
  prepare:
    name: Check the version
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      templates: ${{ steps.version.outputs.templates }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read version.py and compare it with the tag
        id: version
        run: |
          version=$(python3 -c "import version as v; print(f'{v.major}.{v.minor}.{v.patch}' + ('' if v.status == 'stable' else '-' + v.status))")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.py, which says v$version."
            exit 1
          fi
          prerelease=true
          case "$version" in *-*) ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          # The editor looks for templates in a folder named for its version, such as
          # 1.0.stable.csharp. A patch of zero is left out, as core/version.h does.
          templates=$(python3 -c "import version as v; print(f'{v.major}.{v.minor}' + ('.%d' % v.patch if v.patch else '') + f'.{v.status}.csharp')")
          echo "templates=$templates" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux editor
    needs: prepare
    # One LTS behind the newest image, so the binary runs on more distributions.
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      BIN: ./bin/orblit.linuxbsd.editor.x86_64.csharp
      PACKAGE: orblit-${{ needs.prepare.outputs.version }}-linux-x86_64
    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      # A hung apt-get once held a job for the full four hours. The limit fails it early.
      - name: Install system packages
        timeout-minutes: 10
        run: |
          sudo apt-get update
          # wayland-scanner generates the Wayland protocol sources. Xvfb gives the editor app a display.
          sudo apt-get install -y libwayland-bin xvfb

      - name: Set up SCons
        uses: ./.github/actions/setup-scons

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # A failed download stops the job. A release must not drop a feature in silence.
      - name: Fetch AccessKit
        run: python ./dist/scripts/install_accesskit.py

      - name: Build
        uses: ./.github/actions/scons-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: ${{ env.SCONS_FLAGS }} accesskit=yes
          build-name: ${{ env.BUILD_NAME_INPUT }}

      - name: Generate C# glue
        run: ${{ env.BIN }} --headless --generate-csharp-glue ./engine/modules/csharp/glue

      - name: Build .NET solutions
        run: ./engine/modules/csharp/build_scripts/build_assemblies.py --orblit-output-dir=./bin --orblit-platform=linuxbsd

      - name: Check the binary
        run: |
          test -d ./bin/OrblitSharp
          ${{ env.BIN }} --version
          ${{ env.BIN }} --help > /dev/null

      # The library defines LIBORBLIT_ENABLED in every file, so this is a second full build.
      - name: Build the engine library
        uses: ./.github/actions/scons-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: ${{ env.SCONS_FLAGS }} accesskit=yes library_type=shared_library
          build-name: ${{ env.BUILD_NAME_INPUT }}

      - name: Publish the editor app
        run: |
          dotnet publish engine/editor/avalonia/Orblit.Editor.App -c Release -r linux-x64 --self-contained false -o bin
          mv bin/Orblit.Editor.App bin/Orblit

      - name: Lay out the package
        run: |
          rm -rf ./bin/build_deps
          strip ./bin/orblit.*
          strip --strip-unneeded ./bin/liborblit.*.so
          chmod +x ./bin/orblit.* ./bin/Orblit
          mv bin "$PACKAGE"
          cp LICENSE.md "$PACKAGE/"

      - name: Start the packaged editor
        run: xvfb-run -a ./dist/scripts/check_packaged_editor.sh "$PACKAGE/Orblit"

      - name: Zip
        run: |
          zip -qr "$PACKAGE.zip" "$PACKAGE"
          ls -l "$PACKAGE.zip"

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: package-linux
          path: ${{ env.PACKAGE }}.zip
          retention-days: 14

  windows:
    name: Windows editor
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      # The console wrapper prints to a terminal. The glue step and the checks run it.
      BIN: ./bin/orblit.windows.editor.x86_64.csharp.console.exe
      PACKAGE: orblit-${{ needs.prepare.outputs.version }}-windows-x86_64
      PYTHONIOENCODING: utf8
    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up SCons
        uses: ./.github/actions/setup-scons

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Fetch the Direct3D 12 SDK
        run: python ./dist/scripts/install_d3d12_sdk_windows.py

      - name: Fetch ANGLE
        run: python ./dist/scripts/install_angle.py

      - name: Fetch AccessKit
        run: python ./dist/scripts/install_accesskit.py

      - name: Build
        uses: ./.github/actions/scons-build
        with:
          platform: windows
          target: editor
          # The gui subsystem opens no console window. A console wrapper is built beside it.
          scons-flags: ${{ env.SCONS_FLAGS }} windows_subsystem=gui d3d12=yes accesskit=yes angle=yes
          build-name: ${{ env.BUILD_NAME_INPUT }}

      - name: Generate C# glue
        run: ${{ env.BIN }} --headless --generate-csharp-glue ./engine/modules/csharp/glue

      - name: Build .NET solutions
        run: python ./engine/modules/csharp/build_scripts/build_assemblies.py --orblit-output-dir=./bin --orblit-platform=windows

      - name: Check the binary
        run: |
          test -d ./bin/OrblitSharp
          ${{ env.BIN }} --version
          ${{ env.BIN }} --help > /dev/null

      # The library defines LIBORBLIT_ENABLED in every file, so this is a second full build.
      - name: Build the engine library
        uses: ./.github/actions/scons-build
        with:
          platform: windows
          target: editor
          scons-flags: ${{ env.SCONS_FLAGS }} windows_subsystem=gui d3d12=yes accesskit=yes angle=yes library_type=shared_library
          build-name: ${{ env.BUILD_NAME_INPUT }}

      - name: Publish the editor app
        run: |
          dotnet publish engine/editor/avalonia/Orblit.Editor.App -c Release -r win-x64 --self-contained false -o bin
          mv bin/Orblit.Editor.App.exe bin/Orblit.exe

      - name: Lay out the package
        run: |
          rm -rf ./bin/build_deps
          rm -f ./bin/*.exp ./bin/*.lib ./bin/*.pdb
          mv bin "$PACKAGE"
          cp LICENSE.md "$PACKAGE/"

      - name: Start the packaged editor
        run: ./dist/scripts/check_packaged_editor.sh "$PACKAGE/Orblit.exe"

      - name: Zip
        run: |
          7z a -tzip -bso0 "$PACKAGE.zip" "$PACKAGE"
          ls -l "$PACKAGE.zip"

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: package-windows
          path: ${{ env.PACKAGE }}.zip
          retention-days: 14

  macos:
    name: macOS editor
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 300
    env:
      BIN: ./bin/orblit.macos.editor.arm64.csharp
      PACKAGE: orblit-${{ needs.prepare.outputs.version }}-macos-universal
    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up SCons
        uses: ./.github/actions/setup-scons

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Fetch ANGLE
        run: python ./dist/scripts/install_angle.py

      - name: Fetch AccessKit
        run: python ./dist/scripts/install_accesskit.py

      - name: Install the Vulkan SDK
        run: sh ./dist/scripts/install_vulkan_sdk_macos.sh

      - name: Build for x86_64
        uses: ./.github/actions/scons-build
        with:
          platform: macos
          target: editor
          # metal=no stops the warning that x86_64 builds do not support Metal.
          scons-flags: ${{ env.SCONS_FLAGS }} arch=x86_64 vulkan=yes accesskit=yes angle=yes metal=no
          build-name: ${{ env.BUILD_NAME_INPUT }}

      - name: Build for arm64
        uses: ./.github/actions/scons-build
        with:
          platform: macos
          target: editor
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64 vulkan=yes accesskit=yes angle=yes
          build-name: ${{ env.BUILD_NAME_INPUT }}

      # The runner is an arm64 machine, so the arm64 build runs here.
      - name: Generate C# glue
        run: ${{ env.BIN }} --headless --generate-csharp-glue ./engine/modules/csharp/glue

      - name: Build .NET solutions
        run: ./engine/modules/csharp/build_scripts/build_assemblies.py --orblit-output-dir=./bin --orblit-platform=macos

      # The same flags as the arm64 build leave the objects up to date. generate_bundle then
      # merges both architectures, copies OrblitSharp into the bundle and signs it ad hoc.
      - name: Assemble the app bundle
        uses: ./.github/actions/scons-build
        with:
          platform: macos
          target: editor
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64 vulkan=yes accesskit=yes angle=yes generate_bundle=yes
          build-name: ${{ env.BUILD_NAME_INPUT }}

      # The library defines LIBORBLIT_ENABLED in every file, so each is a second full build. They
      # run after the bundle step, which needs the arm64 program's objects.
      - name: Build the engine library for x86_64
        uses: ./.github/actions/scons-build
        with:
          platform: macos
          target: editor
          scons-flags: ${{ env.SCONS_FLAGS }} arch=x86_64 vulkan=yes accesskit=yes angle=yes metal=no library_type=shared_library
          build-name: ${{ env.BUILD_NAME_INPUT }}

      - name: Build the engine library for arm64
        uses: ./.github/actions/scons-build
        with:
          platform: macos
          target: editor
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64 vulkan=yes accesskit=yes angle=yes library_type=shared_library
          build-name: ${{ env.BUILD_NAME_INPUT }}

      # The two outputs differ only in the apphost. Their native libraries are universal already.
      - name: Publish the editor app
        run: |
          for rid in osx-arm64 osx-x64; do
            dotnet publish engine/editor/avalonia/Orblit.Editor.App -c Release -r "$rid" --self-contained false -o "app-$rid"
          done

      # The app takes the bundle's main program name. The engine program moves aside, and Play
      # starts it by the name a C# build gives it. OrblitSharp stays in Resources, where the
      # engine looks when no OrblitSharp sits beside the running program.
      - name: Assemble the app
        run: |
          mv "$(ls -d bin/*.app)" "Orblit Engine.app"
          macos="Orblit Engine.app/Contents/MacOS"
          test -d "Orblit Engine.app/Contents/Resources/OrblitSharp"
          mv "$macos/Orblit" "$macos/orblit.macos.editor.universal.csharp"
          lipo -create bin/liborblit.macos.editor.x86_64.dylib bin/liborblit.macos.editor.arm64.dylib -output "$macos/liborblit.macos.editor.universal.dylib"
          cp -R app-osx-arm64/. "$macos/"
          rm "$macos/Orblit.Editor.App"
          lipo -create app-osx-arm64/Orblit.Editor.App app-osx-x64/Orblit.Editor.App -output "$macos/Orblit"
          strip -x "$macos/orblit.macos.editor.universal.csharp" "$macos/liborblit.macos.editor.universal.dylib"
          lipo -info "$macos/Orblit" "$macos/orblit.macos.editor.universal.csharp" "$macos/liborblit.macos.editor.universal.dylib"

      # Stripping breaks the signature, so the bundle is signed after it. --deep signs each file
      # in Contents/MacOS, the engine program with the same entitlements as the app.
      - name: Sign and check the app
        run: |
          codesign --force --deep --sign - --options runtime --entitlements dist/macos/editor.entitlements "Orblit Engine.app"
          codesign --verify --deep --strict "Orblit Engine.app"
          "Orblit Engine.app/Contents/MacOS/orblit.macos.editor.universal.csharp" --version
          "Orblit Engine.app/Contents/MacOS/orblit.macos.editor.universal.csharp" --help > /dev/null

      - name: Start the packaged editor
        run: ./dist/scripts/check_packaged_editor.sh "Orblit Engine.app/Contents/MacOS/Orblit"

      - name: Package
        run: |
          mkdir "$PACKAGE"
          mv "Orblit Engine.app" "$PACKAGE/"
          cp LICENSE.md "$PACKAGE/"
          ditto -c -k --keepParent "$PACKAGE" "$PACKAGE.zip"
          ls -l "$PACKAGE.zip"

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: package-macos
          path: ${{ env.PACKAGE }}.zip
          retention-days: 14

  # Each target is its own job, so the debug and release templates build at the same time.
  linux-templates:
    name: Linux ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      matrix:
        target: [template_release, template_debug]
    env:
      MATRIX_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install system packages
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-bin

      - name: Set up SCons
        uses: ./.github/actions/setup-scons

      - name: Fetch AccessKit
        run: python ./dist/scripts/install_accesskit.py

      - name: Build
        uses: ./.github/actions/scons-build
        with:
          platform: linuxbsd
          target: ${{ matrix.target }}
          scons-flags: ${{ env.SCONS_FLAGS }} accesskit=yes
          build-name: ${{ env.BUILD_NAME_INPUT }}

      # The exporter looks for linux_release.x86_64 and linux_debug.x86_64.
      - name: Name the template
        run: |
          mkdir templates
          cp "bin/orblit.linuxbsd.$MATRIX_TARGET.x86_64.csharp" "templates/linux_${MATRIX_TARGET#template_}.x86_64"
          strip templates/*

      - name: Upload the template
        uses: actions/upload-artifact@v7
        with:
          name: templates-linux-${{ matrix.target }}
          path: templates/
          retention-days: 14

  windows-templates:
    name: Windows ${{ matrix.target }}
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      matrix:
        target: [template_release, template_debug]
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf8
      MATRIX_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up SCons
        uses: ./.github/actions/setup-scons

      - name: Fetch the Direct3D 12 SDK
        run: python ./dist/scripts/install_d3d12_sdk_windows.py

      - name: Fetch ANGLE
        run: python ./dist/scripts/install_angle.py

      - name: Fetch AccessKit
        run: python ./dist/scripts/install_accesskit.py

      - name: Build
        uses: ./.github/actions/scons-build
        with:
          platform: windows
          target: ${{ matrix.target }}
          scons-flags: ${{ env.SCONS_FLAGS }} windows_subsystem=gui d3d12=yes accesskit=yes angle=yes
          build-name: ${{ env.BUILD_NAME_INPUT }}

      # The exporter looks for windows_release_x86_64.exe and its console wrapper beside it,
      # and copies the Direct3D 12 libraries it finds there named for the architecture.
      - name: Name the template
        run: |
          mkdir templates
          kind=${MATRIX_TARGET#template_}
          cp "bin/orblit.windows.$MATRIX_TARGET.x86_64.csharp.exe" "templates/windows_${kind}_x86_64.exe"
          cp "bin/orblit.windows.$MATRIX_TARGET.x86_64.csharp.console.exe" "templates/windows_${kind}_x86_64_console.exe"
          if [ "$kind" = release ]; then
            for dll in D3D12Core d3d12SDKLayers; do
              cp "bin/$dll.dll" "templates/$dll.x86_64.dll"
            done
          fi
          ls -l templates

      - name: Upload the template
        uses: actions/upload-artifact@v7
        with:
          name: templates-windows-${{ matrix.target }}
          path: templates/
          retention-days: 14

  macos-templates:
    name: macOS ${{ matrix.target }}
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 300
    strategy:
      matrix:
        target: [template_release, template_debug]
    env:
      MATRIX_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up SCons
        uses: ./.github/actions/setup-scons

      - name: Fetch ANGLE
        run: python ./dist/scripts/install_angle.py

      - name: Fetch AccessKit
        run: python ./dist/scripts/install_accesskit.py

      - name: Install the Vulkan SDK
        run: sh ./dist/scripts/install_vulkan_sdk_macos.sh

      - name: Build for x86_64
        uses: ./.github/actions/scons-build
        with:
          platform: macos
          target: ${{ matrix.target }}
          scons-flags: ${{ env.SCONS_FLAGS }} arch=x86_64 vulkan=yes accesskit=yes angle=yes metal=no
          build-name: ${{ env.BUILD_NAME_INPUT }}

      - name: Build for arm64
        uses: ./.github/actions/scons-build
        with:
          platform: macos
          target: ${{ matrix.target }}
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64 vulkan=yes accesskit=yes angle=yes
          build-name: ${{ env.BUILD_NAME_INPUT }}

      # The pack job puts orblit_macos_release.universal in the template app bundle.
      - name: Merge the architectures
        run: |
          mkdir templates
          out="templates/orblit_macos_${MATRIX_TARGET#template_}.universal"
          lipo -create "bin/orblit.macos.$MATRIX_TARGET.x86_64.csharp" "bin/orblit.macos.$MATRIX_TARGET.arm64.csharp" -output "$out"
          strip -x "$out"
          lipo -info "$out"

      - name: Upload the template
        uses: actions/upload-artifact@v7
        with:
          name: templates-macos-${{ matrix.target }}
          path: templates/
          retention-days: 14

  templates:
    name: Pack the export templates
    needs: [prepare, linux-templates, windows-templates, macos-templates]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      PACKAGE: orblit-${{ needs.prepare.outputs.version }}-export-templates
      TEMPLATES: ${{ needs.prepare.outputs.templates }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the templates
        uses: actions/download-artifact@v8
        with:
          pattern: templates-*
          path: templates
          merge-multiple: true

      # The editor reads templates/version.txt to choose the folder it installs into. An
      # artifact loses the executable bit, so it is set again before zipping.
      - name: Pack
        run: |
          cp -R dist/macos_template.app .
          mkdir -p macos_template.app/Contents/MacOS
          mv templates/orblit_macos_*.universal macos_template.app/Contents/MacOS/
          chmod +x macos_template.app/Contents/MacOS/* templates/linux_* templates/*.exe
          zip -q -9 -r templates/macos.zip macos_template.app
          echo "$TEMPLATES" > templates/version.txt
          zip -q -9 -r "$PACKAGE.tpz" templates
          unzip -l "$PACKAGE.tpz"

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: package-templates
          path: ${{ env.PACKAGE }}.tpz
          retention-days: 14

  publish:
    name: Publish the release
    needs: [prepare, linux, windows, macos, templates]
    # Only a pushed tag publishes. A pull request or a manual run stops after the builds.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: packages
          merge-multiple: true

      - name: Write checksums
        working-directory: packages
        run: sha256sum ./*.zip ./*.tpz | tee SHA256SUMS.txt

      - name: Create the release
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Orblit $VERSION" \
            --generate-notes \
            "${flags[@]}"
