name: 🕶️ visionOS Builds
on:
  workflow_call:
  workflow_dispatch:

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_system_fallback_enabled=yes
    debug_symbols=no

jobs:
  visionos-template:
    # From https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job#choosing-github-hosted-runners
    runs-on: macos-26
    name: Template (target=template_release)
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore Orblit build cache
        uses: ./.github/actions/cache-restore
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/deps

      - name: Compilation (arm64)
        uses: ./.github/actions/build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }}
          platform: visionos
          target: template_release

      - name: Save Orblit build cache
        uses: ./.github/actions/cache-save
        continue-on-error: true

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
