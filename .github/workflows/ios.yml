name: iOS

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_system_fallback_enabled=yes
    debug_symbols=no

jobs:
  template:
    runs-on: macos-26
    name: Release template
    timeout-minutes: 60
    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Restore SCons cache
        uses: ./.github/actions/scons-cache-restore
        with:
          cache-name: ios-template
        continue-on-error: true

      - name: Set up SCons
        uses: ./.github/actions/setup-scons

      - name: Fetch AccessKit
        id: accesskit
        uses: ./.github/actions/fetch-sdk
        with:
          name: AccessKit
          command: python ./dist/scripts/install_accesskit.py

      - name: Build for arm64
        uses: ./.github/actions/scons-build
        with:
          platform: ios
          target: template_release
          scons-flags: ${{ env.SCONS_FLAGS }} accesskit=${{ steps.accesskit.outputs.enabled }}

      - name: Save SCons cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/scons-cache-save
        with:
          cache-name: ios-template
        continue-on-error: true

      - name: Upload binaries
        uses: ./.github/actions/upload-binaries
        with:
          name: ios-template
