name: 🤖 Android Builds
on:
  workflow_call:
  workflow_dispatch:

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_system_fallback_enabled=yes

jobs:
  build-android:
    runs-on: ubuntu-26.04
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor (target=editor)
            cache-name: android-editor
            target: editor
            scons-flags: >-
              arch=arm64
              production=yes

          - name: Template arm32 (target=template_debug, arch=arm32)
            cache-name: android-template-arm32
            target: template_debug
            scons-flags: arch=arm32

          - name: Template arm64 (target=template_debug, arch=arm64)
            cache-name: android-template-arm64
            target: template_debug
            scons-flags: arch=arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Orblit build cache
        uses: ./.github/actions/cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/deps

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./dist/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Swappy
        shell: sh
        id: swappy_sdk
        run: |
          if python ./dist/scripts/install_swappy_android.py; then
            echo "SWAPPY_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Swappy installation failed, building without Swappy support."
            echo "SWAPPY_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Perfetto
        shell: sh
        id: perfetto_sdk
        run: |
          if python ./dist/scripts/install_perfetto.py; then
            echo "PROFILER_ENABLED=perfetto" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Perfetto installation failed, building without Perfetto support."
            echo "PROFILER_ENABLED=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilation
        uses: ./.github/actions/build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} profiler=${{ steps.perfetto_sdk.outputs.PROFILER_ENABLED }} swappy=${{ steps.swappy_sdk.outputs.SWAPPY_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}
          platform: android
          target: ${{ matrix.target }}

      - name: Save Orblit build cache
        uses: ./.github/actions/cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Generate Orblit templates
        if: matrix.target == 'template_debug'
        run: |
          cd engine/platform/android/java
          ./gradlew generateOrblitTemplates
          cd ../../..
          ls -l bin/

      - name: Generate Orblit editor
        if: matrix.target == 'editor'
        run: |
          cd engine/platform/android/java
          ./gradlew generateOrblitEditor
          ./gradlew generateOrblitHorizonOSEditor
          ./gradlew generateOrblitPicoOSEditor
          cd ../../..
          ls -l bin/android_editor_builds/

          # Separate different editors for multiple artifacts
          mkdir horizonos
          mv bin/android_editor_builds/*-horizonos-* horizonos
          mkdir picoos
          mv bin/android_editor_builds/*-picoos-* picoos

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}

      - name: Upload artifact (Horizon OS)
        if: matrix.target == 'editor'
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}-horizonos
          path: horizonos

      - name: Upload artifact (PICO OS)
        if: matrix.target == 'editor'
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}-picoos
          path: picoos
