name: Lint C++
description: Run clangd-tidy on a list of changed C++ files. The build must have written compile_commands.json.

inputs:
  files:
    description: JSON array of file paths. An empty array checks nothing.
    default: "[]"

runs:
  using: composite
  steps:
    - name: Check for the compilation database
      shell: bash
      run: |
        if [ ! -f compile_commands.json ]; then
          echo "::error::clangd-tidy needs compile_commands.json. Build with compiledb=yes."
          exit 1
        fi

    - name: Install clangd-tidy
      shell: bash
      run: python -m pip install clangd clangd-tidy clang-tidy==22.1.7

    - name: Run clangd-tidy
      shell: bash
      run: |
        # A file keeps a long list out of the environment, which holds 128 KiB per variable. The
        # quoted delimiter stops the shell from reading the JSON, and a one-line array never equals it.
        cat > files.json <<'FILES_JSON'
        ${{ inputs.files }}
        FILES_JSON
        jq -r '.[]' files.json > files.txt
        count=$(wc -l < files.txt)
        if [ "$count" -eq 0 ]; then
          echo "No changed C++ files."
          exit 0
        fi
        # A change this wide is a rename or a sync. Checking every file would pass the job time limit.
        max_files=400
        if [ "$count" -gt "$max_files" ]; then
          echo "::notice::Skipped clangd-tidy. $count files changed and the limit is $max_files."
          exit 0
        fi
        # xargs splits the list, so a long list stays under the argument limit.
        xargs -d '\n' -a files.txt clangd-tidy
