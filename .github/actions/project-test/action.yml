name: Test Orblit project
description: Run the test Orblit project.

inputs:
  bin:
    description: The path to the Orblit executable
    required: true

runs:
  using: composite
  steps:
    # The test project lives in tests/project.
    # Editor is quite complicated piece of software, so it is easy to introduce bug here.

    - name: Open and close editor (Headless)
      shell: sh
      run: |
        xvfb-run ${{ inputs.bin }} --headless --import --path tests/project 2>&1 | tee sanitizers_log.txt || true
        dist/scripts/check_ci_log.py sanitizers_log.txt

    - name: Open and close editor (Vulkan)
      shell: sh
      run: |
        xvfb-run ${{ inputs.bin }} --audio-driver Dummy --import --path tests/project 2>&1 | tee sanitizers_log.txt || true
        dist/scripts/check_ci_log.py sanitizers_log.txt

    - name: Open and close editor (GLES3)
      shell: sh
      run: |
        DRI_PRIME=0 xvfb-run ${{ inputs.bin }} --audio-driver Dummy --rendering-driver opengl3 --import --path tests/project 2>&1 | tee sanitizers_log.txt || true
        dist/scripts/check_ci_log.py sanitizers_log.txt

    # Run test project
    - name: Run project
      shell: sh
      run: |
        xvfb-run ${{ inputs.bin }} --quit-after 40 --audio-driver Dummy --path tests/project 2>&1 | tee sanitizers_log.txt || true
        dist/scripts/check_ci_log.py sanitizers_log.txt
