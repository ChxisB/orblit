name: Upload binaries
description: Upload build output as a workflow artifact.

inputs:
  name:
    description: Artifact name.
    default: ${{ github.job }}
  path:
    description: Files to upload.
    default: bin/*

runs:
  using: composite
  steps:
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        # Shorter than the 90 day default, to save storage.
        retention-days: 60
