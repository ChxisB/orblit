# Determines if build actions should occur after static checks are ran. Broadly speaking, these
#  files changing would result in SCons rebuilding the engine, or are otherwise pertinent to the
#  buildsystem itself.
sources:
  - .github/{actions/*,workflows}/*.yml
  - "**/{SConstruct,SCsub,*.py}"
  - "**/*.{h,hpp,hh,hxx,c,cpp,cc,cxx,m,mm,inc,glsl}"
  - engine/core/native_extension/native_extension_interface.json
  - dist/extension_api_validation/**
  - engine/modules/*/tests/**
  - engine/modules/csharp/**/*.{cs,csproj,sln,props,targets}
  - engine/platform/android/java/{gradle*,**/*.{jar,java,kt,gradle}}
  - engine/platform/web/{package{,-lock}.json,js/**/*.js}
  - tests/**

# Determines which files are appropriate for running clangd-tidy checks on. This is a subset out
#  of necessity, as we're only evaluating a Linux runner.
clangd:
  - "**/*.{h,hpp,hxx,hh,c,cpp,cxx,cc}"
  - "!**/thirdparty/**"
  - "!**/*-so_wrap.{h,c}"
  - "!engine/backends/{apple*,core*,d3d12,metal,wasapi,windows,winmidi,xaudio2}/**"
  - "!engine/editor/shader/shader_baker/shader_baker_export_plugin_platform_{d3d12,metal}.{h,cpp}"
  - "!engine/modules/camera/camera_{android,macos,win}.{h,cpp}"
  - "!engine/modules/openxr/extensions/platform/openxr_{android,metal}_extension.{h,cpp}"
  - "!engine/platform/{android,ios,macos,visionos,web,windows}/**"
  - "engine/platform/{android,ios,macos,visionos,web,windows}/{api,export}/*.{h,hpp,hxx,hh,c,cpp,cxx,cc}"
