name: orblit_test
description: >-
  Tests for a game that run with no window. A stage that steps sampled time
  and holds the controls, finders and matchers for a scene document and for
  recorded sound, and a text capture of what a frame changed.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  matcher: ^0.12.16
  orblit_audio:
    path: ../orblit_audio
  orblit_input:
    path: ../orblit_input
  orblit_scene:
    path: ../orblit_scene
  vector_math: ^2.1.4

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
