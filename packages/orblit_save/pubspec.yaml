name: orblit_save
description: >-
  Saves for a game server: bytes under a key with a reason, written off the
  tick by a worker isolate, whole after a crash, and staggered autosaves,
  with a history of versions, restore and offline edit.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  crypto: ^3.0.7

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
