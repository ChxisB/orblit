name: orblit_path
description: >-
  Curves to follow and ways across ground: splines with tilt, rails and
  patrols, and grid and navmesh pathfinding that walks an agent round a wall.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  orblit_agent:
    path: ../orblit_agent
  orblit_terrain:
    path: ../orblit_terrain
  vector_math: ^2.1.4

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
