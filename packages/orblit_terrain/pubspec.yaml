name: orblit_terrain
description: >-
  Ground as data: sparse regions of height, cover and colour, the files they
  are kept in, the height and slope of the ground at any point, the brushes
  that shape it, and the grass, stones and trees scattered over it.
version: 0.3.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  vector_math: ^2.1.4

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
