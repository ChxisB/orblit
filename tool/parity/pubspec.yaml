name: orblit_parity_tool
description: >-
  Writes the fixtures the C# ports are checked against. Not a package anyone
  depends on.
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  orblit_agent:
    path: ../../packages/orblit_agent
  orblit_audio:
    path: ../../packages/orblit_audio
  orblit_camera:
    path: ../../packages/orblit_camera
  orblit_cells:
    path: ../../packages/orblit_cells
  orblit_collide:
    path: ../../packages/orblit_collide
  orblit_core:
    path: ../../packages/orblit_core
  orblit_effect:
    path: ../../packages/orblit_effect
  orblit_light:
    path: ../../packages/orblit_light
  orblit_noise:
    path: ../../packages/orblit_noise
  orblit_profile:
    path: ../../packages/orblit_profile
  orblit_progress:
    path: ../../packages/orblit_progress
  orblit_save:
    path: ../../packages/orblit_save
  orblit_sequence:
    path: ../../packages/orblit_sequence
  orblit_sprite:
    path: ../../packages/orblit_sprite
  orblit_terrain:
    path: ../../packages/orblit_terrain
  vector_math: ^2.1.4

dev_dependencies:
  lints: ^5.0.0
